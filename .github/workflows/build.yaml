name: build image

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - docker

jobs:
  docker:
    name: Build image with docker
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup dockerx builder
      run: |
        docker buildx create \
          --driver-opt image=moby/buildkit:master \
          --name insecure-builder \
          --buildkitd-flags '--allow-insecure-entitlement security.insecure'
        docker buildx use insecure-builder

    - name: Build image
      env:
        MKOSI_VERSION: v22
      run: |
        mkdir build
        docker buildx build \
          -t mkosi-build \
          --build-arg MKOSI_VERSION \
          --progress=plain \
          -o type=local,dest=$PWD/build \
          --allow security.insecure \
          .

  nix:
    name: Build image within a nix flake
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - uses: cachix/install-nix-action@v25

    - name: mkosi
      run: |
        nix develop -c mkosi genkey
        nix develop -c mkosi -C ./initrd build
        nix develop -c mkosi build

  host:
    name: Build image using host tools
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies

      run: |
        sudo apt-get update
        sudo apt-get install -y \
          btrfs-progs \
          bubblewrap \
          cryptsetup-bin \
          dnf \
          lvm2 \
          mtools \
          sbsigntool \
          systemd-ukify

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install mkosi
      run: |
        pip install git+https://github.com/systemd/mkosi.git@v18
        cp $(which mkosi) /usr/local/bin/mkosi

    - name: mkosi
      run: |
        sudo mkosi genkey
        sudo mkosi -C ./initrd build
        sudo mkosi build
